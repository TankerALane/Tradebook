name: Release

# On a pushed version tag (e.g. v0.1.0-alpha): package with the BigWigs packager, upload to
# CurseForge (project 1803120) and create a GitHub release. Tags containing "alpha" or
# "beta" are uploaded as alpha/beta files.
#
# Run it by hand from the Actions tab for a DRY RUN: it builds the zip without uploading
# anything and attaches it to the run so it can be checked.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release (tag)
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2

      - name: Package only (dry run, nothing uploaded)
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Keep the dry-run zip
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tradebook-dry-run
          path: .release/*.zip
          include-hidden-files: true
