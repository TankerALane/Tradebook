name: Game data check

# Weekly (and on demand): pull WoW Forever's newest build from wago.tools, regenerate the
# skill-up thresholds (Tradebook/Data/SkillLevels.lua), and open a pull request if anything
# changed. Nothing is merged or released automatically.
on:
  schedule:
    - cron: "0 23 * * 2" # Tuesdays 23:00 UTC = 3pm PST (4pm during PDT); after weekly maintenance
  workflow_dispatch:
    inputs:
      build:
        description: "Forever build (blank = newest on wago.tools)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate skill-up thresholds
        id: update
        run: |
          python -I scripts/update_game_data.py ${{ github.event.inputs.build }} | tee report.txt
          echo "build=$(sed -n 's/^Forever build: \([^ ]*\).*/\1/p' report.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Lint and tests on the new data
        run: |
          luacheck Tradebook tests
          lua5.1 tests/run.lua

      - name: Open a pull request if the data changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: game-data/${{ steps.update.outputs.build }}
          commit-message: "Game data: skill-up thresholds for Forever ${{ steps.update.outputs.build }}"
          title: "Game data update: Forever ${{ steps.update.outputs.build }}"
          body-path: report.txt
          add-paths: |
            Tradebook/Data/SkillLevels.lua
            Tradebook/Data/Zones.lua
            Tradebook/Data/VendorPrices.lua
            Tradebook/Data/RecipeItems.lua
          delete-branch: true
