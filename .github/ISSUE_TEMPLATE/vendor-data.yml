name: Vendor data
description: Share the vendors Tradebook scanned for you (/tb share), so everyone gets them in the next update.
title: "Vendor data"
labels: ["vendor-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! In game, type **/tb share**, click **Select all**, copy (Ctrl+C) and paste below.
        It only contains vendor data (vendor names, where they stand, what they sell and prices), nothing about your characters.
  - type: textarea
    id: data
    attributes:
      label: Share text
      description: Paste everything from /tb share, starting with TBV1.
      render: text
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: Anything else? (optional)
      description: e.g. a vendor that sells something unusual, or a price that looked wrong.
